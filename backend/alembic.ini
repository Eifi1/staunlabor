# Alembic, for the accounts' database: `npm run db:migrate` (= `uv run alembic
# upgrade head` from backend/). The URL is never here: env.py takes the app's
# own, STAUNLABOR_DATABASE_URL, so a migration and the app it serves cannot
# point at two databases.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Revisions are numbered by hand (0001, 0002, ...), so their order reads off a listing.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
