# Cloud Build pipeline for Staunlabor on Cloud Run, GCP project `staunlabor`:
# two images, then the backend, then the web service, which finds the backend's
# host and proxies /api to it. Nothing else: no database to migrate, no job, no
# schedule, and one secret, the edge token. Both services scale to zero.
#
# One-time prerequisites are deploy/README.md §1.

substitutions:
  _REGION: europe-west4
  _AR_REPO: staunlabor                              # Artifact Registry repo name
  # Both services run as this account, whose one grant is reading the secret
  # staunlabor-edge-token (setup-gcp.sh §8): the backend computes and answers,
  # Caddy serves files and proxies /api, and neither needs anything else of
  # GCP. Without it a service runs as the Compute default account, which a
  # project gives roles/editor.
  _RUN_SA: staunlabor-run@staunlabor.iam.gserviceaccount.com
  _APP_BASE_URL: https://staunlabor.app             # == the custom domain
  _TAG: latest                                      # the deploy workflow passes the short SHA

# The build runs as an account of its own, with only what this file does: push
# the images, deploy Cloud Run as _RUN_SA, write its log, read its source.
serviceAccount: projects/staunlabor/serviceAccounts/staunlabor-build@staunlabor.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  # ── build + push images ─────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.backend
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-backend:${_TAG}
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.web
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-web:${_TAG}
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-backend:${_TAG}']

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-web:${_TAG}']

  # ── backend ─────────────────────────────────────────────────────────────
  # STAUNLABOR_TRUSTED_PROXY_HOPS=3: the request budget reads the caller's
  # address three entries from the RIGHT of X-Forwarded-For (the web service's
  # front end, Caddy and the backend's front end each append one; README §4),
  # never the left-most, which the client writes.
  #
  # --ingress=internal: the count holds only for requests that came through
  # Caddy. A caller who reached the run.app URL directly got ONE entry
  # appended, so the third from the right was its own to write, and a fresh
  # fake per request was a fresh budget per request (150 of 150 answered,
  # 2026-11-13). Internal, the backend takes only what arrives through the
  # project's VPC, which is the web service's egress below; the run.app URL
  # answers everybody else 404. Still --allow-unauthenticated: Caddy carries
  # no identity token, and ingress is what keeps strangers out.
  #
  # STAUNLABOR_EDGE_TOKEN, the same secret Caddy sets as X-Staunlabor-Edge:
  # the proof that a request came through Caddy, without which the budget
  # counts one hop, not three (server-kit's vouched_hops). It holds even if the
  # backend's ingress is ever opened again; the internal ingress is the second
  # line, the token the one every sibling app shares.
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - staunlabor-backend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-backend:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --ingress=internal
      - --service-account=${_RUN_SA}
      - --min-instances=0
      - --max-instances=3
      - --concurrency=20
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --set-env-vars=STAUNLABOR_APP_BASE_URL=${_APP_BASE_URL},STAUNLABOR_TRUSTED_PROXY_HOPS=3
      - --set-secrets=STAUNLABOR_EDGE_TOKEN=staunlabor-edge-token:latest

  # ── web (public; finds the backend host and proxies /api to it) ─────────
  # Direct VPC egress for ALL traffic, so Caddy's requests to the backend's
  # run.app host leave through the default network, whose europe-west4 subnet
  # has Private Google Access (setup-gcp.sh §7), and count as internal. Only
  # `all-traffic` does that: `private-ranges-only` would send the run.app
  # address the public way, and the backend would refuse it. Caddy talks to
  # nothing else, so it needs no way out to the internet (no Cloud NAT). The
  # hop count above is unchanged by it (measured 2026-11-13).
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        BACKEND_URL=$$(gcloud run services describe staunlabor-backend \
          --region=${_REGION} --format='value(status.url)')
        BACKEND_HOST=$${BACKEND_URL#https://}
        echo "Proxying /api → $$BACKEND_HOST"
        gcloud run deploy staunlabor-web \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-web:${_TAG} \
          --region=${_REGION} --platform=managed --port=8080 \
          --allow-unauthenticated \
          --network=default --subnet=default --vpc-egress=all-traffic \
          --service-account=${_RUN_SA} \
          --min-instances=0 --max-instances=3 --memory=256Mi --cpu=1 \
          --set-env-vars=BACKEND_HOST=$$BACKEND_HOST \
          --set-secrets=EDGE_TOKEN=staunlabor-edge-token:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-backend:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/staunlabor-web:${_TAG}
